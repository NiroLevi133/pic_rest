version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci

        # Inject env variables into Next.js
        - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
        - echo "DIRECT_URL=$DIRECT_URL" >> .env.production
        - echo "GEMINI_IMAGE_MODEL=$GEMINI_IMAGE_MODEL" >> .env.production
        - echo "IMAGE_PROVIDER=$IMAGE_PROVIDER" >> .env.production
        - echo "IMAGE_QUALITY=$IMAGE_QUALITY" >> .env.production
        - echo "LLM_PROVIDER=$LLM_PROVIDER" >> .env.production
        - echo "GOOGLE_API_KEY=$GOOGLE_API_KEY" >> .env.production
        - echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env.production
        - echo "SETTINGS_ENCRYPTION_KEY=$SETTINGS_ENCRYPTION_KEY" >> .env.production
        - echo "LAMBDA_GENERATE_URL=$LAMBDA_GENERATE_URL" >> .env.production
        - echo "BG_SECRET=$BG_SECRET" >> .env.production
        - echo "SESSION_SECRET=$SESSION_SECRET" >> .env.production
        - echo "OWNER_PHONE=$OWNER_PHONE" >> .env.production
        - echo "APP_URL=$APP_URL" >> .env.production
        - echo "SUPABASE_URL=$SUPABASE_URL" >> .env.production
        - echo "SUPABASE_SERVICE_ROLE_KEY=$SUPABASE_SERVICE_ROLE_KEY" >> .env.production
        - echo "SUPABASE_BUCKET=$SUPABASE_BUCKET" >> .env.production
        # Photo store (/shop). Empty values fall back to the defaults in src/shop.
        - echo "NEXT_PUBLIC_SHOP_WHATSAPP=$NEXT_PUBLIC_SHOP_WHATSAPP" >> .env.production
        - echo "NEXT_PUBLIC_SHOP_URL=$NEXT_PUBLIC_SHOP_URL" >> .env.production
        - echo "SHOP_DAILY_LIMIT_PER_CLIENT=$SHOP_DAILY_LIMIT_PER_CLIENT" >> .env.production
        - echo "SHOP_DAILY_LIMIT_TOTAL=$SHOP_DAILY_LIMIT_TOTAL" >> .env.production
        - echo "SHOP_RETENTION_DAYS=$SHOP_RETENTION_DAYS" >> .env.production
        - echo "SHOP_OPENAI_IMAGE_QUALITY=$SHOP_OPENAI_IMAGE_QUALITY" >> .env.production
        - echo "SHOP_UNLIMITED_PHONES=$SHOP_UNLIMITED_PHONES" >> .env.production

        # Bring the database to the current schema (baseline, migrations, legacy image sync) — idempotent
        - node scripts/db-setup.mjs

    build:
      commands:
        - npm run build
        - cp .env.production .next/.env.production

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*